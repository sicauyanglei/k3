<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>金蝶财务软件 K3</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app">
    <div id="login-screen" class="screen active">
      <div class="login-box">
        <div class="login-header">
          <img src="assets/logo.png" alt="K3" class="logo">
          <h1>金蝶财务软件 K3</h1>
          <p class="version">Windows XP 版 v1.0.0</p>
        </div>
        <form id="login-form">
          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="username" name="username" value="admin" autofocus>
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" name="password" value="">
          </div>
          <div class="form-group">
            <label>账套</label>
            <select id="account-book" name="account_book">
              <option value="">-- 请选择账套 --</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-block">登录</button>
        </form>
        <div class="login-footer">
          <p>默认账号: admin / admin</p>
        </div>
      </div>
    </div>

    <div id="main-screen" class="screen">
      <div id="header">
        <div class="header-left">
          <img src="assets/logo-small.png" alt="K3" class="logo-small">
          <span class="app-title">金蝶财务软件 K3</span>
        </div>
        <div class="header-center">
          <span class="company-name" id="company-name">演示账套</span>
        </div>
        <div class="header-right">
          <span class="user-info">当前用户: <b id="current-user">admin</b></span>
          <button class="btn btn-sm" id="btn-logout">退出</button>
        </div>
      </div>
      
      <div id="container">
        <div id="sidebar">
          <ul class="nav-menu" id="nav-menu"></ul>
        </div>
        
        <div id="content">
          <div id="breadcrumb"></div>
          <div id="main-content"></div>
        </div>
      </div>
      
      <div id="footer">
        <span class="status-left">就绪</span>
        <span class="status-right" id="current-date"></span>
      </div>
    </div>
  </div>

  <script src="lib/sql.js"></script>
  <script src="js/database.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
